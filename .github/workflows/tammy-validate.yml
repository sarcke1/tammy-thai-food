name: Tammy Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - validate
          - add_nems

permissions:
  contents: write

jobs:
  tammy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validation
        if: inputs.action == 'validate'
        run: |
          test -f .github/PROJECT_RULES.md
          echo "Validation OK"

      - name: Ajouter les Nems
        if: inputs.action == 'add_nems'
        run: |
          python3 <<'PY'
from pathlib import Path

path = Path("v2/js/data.js")
text = path.read_text(encoding="utf-8")

if "Nems maison" in text:
    print("Les Nems existent déjà.")
    raise SystemExit(0)

insert = '''
,
{
  id: "nems-maison",
  name: "Nems maison",
  price: 1,
  image: "Nem.png",
  description: "Nem maison croustillant préparé selon la recette traditionnelle thaïlandaise.",
  category: "entrees",
  allowSpice: false,
  promo: "4 achetés = le 5ᵉ offert"
}
'''

marker = "];"

if marker in text:
    text = text.replace(marker, insert + "\n];", 1)
    path.write_text(text, encoding="utf-8")
else:
    raise SystemExit("Impossible de trouver la fin du tableau produits.")
PY

      - name: Commit
        if: inputs.action == 'add_nems'
        run: |
          git config user.name "Tammy Bot"
          git config user.email "tammy-bot@users.noreply.github.com"
          git add v2/js/data.js
          git commit -m "V3.01 Ajout des Nems maison" || exit 0
          git push
