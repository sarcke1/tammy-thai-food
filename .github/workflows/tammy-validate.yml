name: Tammy Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action à effectuer"
        required: true
        type: choice
        options:
          - bootstrap
          - validate
      version:
        description: "Version"
        required: false
        default: "V3.00"

permissions:
  contents: write

jobs:
  tammy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validation
        if: inputs.action == 'validate'
        run: |
          test -f .github/PROJECT_RULES.md
          echo "Validation OK"

      - name: Bootstrap DevOps
        if: inputs.action == 'bootstrap'
        run: |
          cat > PROJECT_MEMORY.md <<'EOF'
          # PROJECT MEMORY

          V2 : sauvegarde

          V3 : développement actif

          Prix validés

          - Pad Thaï : 10 €
          - Chicken Massena : 9 €
          - Tom Kha Kai : 9 €
          - Riz frit : 7 €
          - Rouleau printemps : 2 €
          - Nem : 1 €

          Promo

          4 nems achetés = 1 offert
          EOF

          cat > CHANGELOG.md <<'EOF'
          # CHANGELOG

          ## V3.00

          Bootstrap DevOps.
          EOF

          cat > ROADMAP_V3.md <<'EOF'
          # ROADMAP V3

          - V3.01 Nems
          - V3.02 Commandes RATP
          - V3.03 Planning
          - V3.04 Cuisine
          EOF

          cat > RECIPES_COSTS.md <<'EOF'
          # RECETTES VALIDÉES

          Pad Thaï 10 €
          Chicken Massena 9 €
          Tom Kha Kai 9 €
          Riz frit 7 €
          Rouleau printemps 2 €
          Nem 1 €
          EOF

          cat > RELEASE_LOCK.md <<'EOF'
          CURRENT_VERSION=V3.00
          NEXT_VERSION=V3.01
          LOCKED_VERSION=V2
          EOF

      - name: Commit automatique
        if: inputs.action == 'bootstrap'
        run: |
          git config user.name "Tammy Bot"
          git config user.email "tammy-bot@users.noreply.github.com"

          git add .

          git commit -m "DevOps: bootstrap project files" || exit 0

          git push
