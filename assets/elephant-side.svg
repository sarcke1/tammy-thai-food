<style>
#trunk{animation:trunkWave 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:top left}
@keyframes trunkWave{0%,100%{transform:rotate(0deg)}48%{transform:rotate(-3deg)}58%{transform:rotate(-8deg)}72%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){#trunk{animation:none}}
</style>
