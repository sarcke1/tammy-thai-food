  <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#829982"/><stop offset="1" stop-color="#58705f"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7aa58"/><stop offset="1" stop-color="#9b6e31"/></linearGradient>
